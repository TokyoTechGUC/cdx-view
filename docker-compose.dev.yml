services:
  client-dev:
    build:
      args:
        USER_ID: ${USER_ID}
        GROUP_ID: ${GROUP_ID}
      context: ./client
      dockerfile: Dockerfile
      target: development
    ports:
      - "${HOST_CLIENT_PORT}:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    env_file:
      - .env.dev
    command: npm run dev -- --host
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  server-dev:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: development
    ports:
      - "${HOST_SERVER_PORT}:8000"
    volumes:
      - ./server:/app
      - ${STORAGE_LOCATION}:/data
      - ${DB_LOCATION}:/db
    environment:
      - STORAGE_DIR=/data
      - DB_PATH=/db/${DB_NAME}
    command:
      - uvicorn
      - app.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --reload
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 512M

  registry-dev:
    build:
      args:
        MAMBA_USER_ID: ${USER_ID}
        MAMBA_USER_GID: ${GROUP_ID}
      context: ./registry
      dockerfile: Dockerfile
    user: "${USER_ID}:${GROUP_ID}"
    volumes:
      - ./registry:/app
      - ${STORAGE_LOCATION}:/data
      - ${DB_LOCATION}:/db
    environment:
      - STORAGE_DIR=/data
      - DB_PATH=/db/${DB_NAME}
    command: python register.py --help
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 512M
