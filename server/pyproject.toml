[project]
name = "cdx-view-server"
version = "0.1.0"
description = "Tile-serving API for cdx-view"
requires-python = ">=3.10,<3.11"
dependencies = [
    "fastapi==0.128.1",
    "pydantic==2.12.5",
    "uvicorn==0.40.0",
    "mercantile==1.2.1",
    "titiler.core",
    "titiler.xarray[full]",
    "numpy==2.2.6",
    "pandas==2.2.3",
    "xarray==2025.1.2",
    "netCDF4==1.7.4",
    "scipy==1.15.2",
    "matplotlib==3.10.8",
]

[tool.uv]
package = false
