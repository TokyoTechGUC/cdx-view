[project]
name = "cdx-view-server"
version = "0.1.0"
description = "Tile-serving API for cdx-view"
requires-python = ">=3.10,<3.11"
dependencies = [
    "fastapi",
    "pydantic",
    "uvicorn",
    "mercantile",
    "titiler.core",
    "titiler.xarray[full]",
    "numpy",
    "pandas",
    "xarray",
    "netCDF4",
    "scipy",
    "matplotlib",
]

[tool.uv]
package = false
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin'",
]

[dependency-groups]
dev = [
    "ruff>=0.16.8",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
